name: Sync Gyro Formula

# Pulls the generated Formula from the newest published Gyro release into this
# tap. Publishing lives here, rather than pushing from wytzeh197/Gyro, so the
# job can use this repository's own GITHUB_TOKEN instead of a cross-repository
# personal access token that silently expires.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Gyro release tag to sync (defaults to the latest published release)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-gyro-formula
  cancel-in-progress: false

env:
  GYRO_REPOSITORY: wytzeh197/Gyro

jobs:
  sync:
    name: Sync Formula from the latest Gyro release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@v4

      - name: Resolve the release tag
        id: release
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GYRO_REPOSITORY" --json tagName --jq .tagName)"
          fi
          RELEASE="$(gh release view "$TAG" --repo "$GYRO_REPOSITORY" --json isDraft,isPrerelease)"
          if [ "$(jq -r .isDraft <<<"$RELEASE")" != "false" ]; then
            echo "::error::$TAG is still a draft release."
            exit 1
          fi
          if [ "$(jq -r .isPrerelease <<<"$RELEASE")" != "false" ]; then
            echo "::error::$TAG is a prerelease; the tap only serves full releases."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag $TAG."
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}

      - name: Require a green CLI validation for this tag
        run: |
          set -euo pipefail
          # publish-homebrew.yml installs the released CLI from this exact
          # Formula on both macOS architectures. Refuse to serve a Formula
          # whose validation did not pass.
          SUCCESSES="$(gh api \
            "repos/$GYRO_REPOSITORY/actions/workflows/publish-homebrew.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.head_branch == \"$TAG\" and .conclusion == \"success\")] | length")"
          if [ "$SUCCESSES" -eq 0 ]; then
            echo "::error::No successful CLI validation run found for $TAG."
            exit 1
          fi
          echo "Found $SUCCESSES successful validation run(s) for $TAG."
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}

      - name: Download and validate the generated Formula
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GYRO_REPOSITORY" \
            --pattern gyro.rb \
            --dir release-assets
          FORMULA="release-assets/gyro.rb"
          VERSION="${TAG#v}"
          test "$TAG" != "$VERSION"
          test -s "$FORMULA"
          ! grep -q "REPLACE_WITH" "$FORMULA"
          grep -F 'homepage "https://github.com/wytzeh197/Gyro"' "$FORMULA"
          grep -F "version \"$VERSION\"" "$FORMULA"
          grep -F 'url "https://github.com/wytzeh197/Gyro/releases/download/v#{version}/gyro-cli-#{version}-aarch64-apple-darwin.tar.gz"' "$FORMULA"
          grep -F 'url "https://github.com/wytzeh197/Gyro/releases/download/v#{version}/gyro-cli-#{version}-x86_64-apple-darwin.tar.gz"' "$FORMULA"
          test "$(grep -Ec '^[[:space:]]+sha256 "[0-9a-f]{64}"$' "$FORMULA")" -eq 2
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}

      - name: Commit the Formula when it changed
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp release-assets/gyro.rb Formula/gyro.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gyro.rb
          if git diff --cached --quiet; then
            echo "The tap already serves the Formula for $TAG."
            exit 0
          fi
          git commit -m "gyro ${TAG#v}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "Published gyro ${TAG#v} to the tap."
        env:
          TAG: ${{ steps.release.outputs.tag }}
